pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8080;
        root /srv;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control no-store always;
        # The existing application endpoint requires an active Google session AND
        # global administrator permission. Auth responses are never cached.
        location = /_installer_admin {
            internal;
            proxy_pass http://server:8088/api/agents;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
        location = /downloads/p4forge-desktop-6n6u52l-setup.zip {
            auth_request /_installer_admin;
            alias /private/p4forge-desktop-6n6u52l-setup.zip;
            default_type application/zip;
            add_header Content-Disposition 'attachment; filename="p4forge-desktop-6n6u52l-setup.zip"';
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control 'private, no-store' always;
            limit_except GET { deny all; }
        }
        location = /downloads/p4forge-windows-x64-preview.zip {
            default_type application/zip;
            add_header Content-Disposition 'attachment; filename="p4forge-windows-x64-preview.zip"';
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            limit_except GET { deny all; }
        }
        location = /downloads/p4forge-windows-x64-preview.zip.sha256 {
            default_type text/plain;
            limit_except GET { deny all; }
        }
        location = /downloads/p4forge-windows-self-patch-bootstrap.zip {
            default_type application/zip;
            add_header Content-Disposition 'attachment; filename="p4forge-windows-self-patch-bootstrap.zip"';
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control no-store always;
            limit_except GET { deny all; }
        }
        location = /downloads/p4forge-windows-self-patch-bootstrap.zip.sha256 {
            default_type text/plain;
            limit_except GET { deny all; }
        }
        location / { return 404; }
    }
}
