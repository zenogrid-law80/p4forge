# Optional self-hosted ticket renewal. Use with compose.yaml + compose.server.yaml.
# Prepare the private policy/password files first; see README.
services:
  server:
    depends_on:
      credential-init:
        condition: service_completed_successfully
    environment:
      P4FORGE_CREDENTIAL_POLICY: /renewal-secrets/policy.json
      P4FORGE_CREDENTIAL_DIR: /var/lib/p4forge/credentials
    volumes:
      - renewal_secrets:/renewal-secrets:ro
      - managed_credentials:/var/lib/p4forge/credentials
  credential-init:
    profiles: [server, tls]
    image: debian:bookworm-slim
    network_mode: none
    command:
      - sh
      - -c
      - >-
        set -eu; umask 077;
        for name in policy.json read-password publisher-password; do
          cp /run/secrets/$$name /private/$$name.next;
          chmod 600 /private/$$name.next;
          chown 10002:10002 /private/$$name.next;
          mv /private/$$name.next /private/$$name;
        done;
        chown 10002:10002 /managed; chmod 700 /managed
    secrets:
      - source: renewal_policy
        target: policy.json
      - source: renewal_read_password
        target: read-password
      - source: renewal_publish_password
        target: publisher-password
    volumes:
      - renewal_secrets:/private
      - managed_credentials:/managed
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
secrets:
  renewal_policy:
    file: .local/credential-policy.json
  renewal_read_password:
    file: .local/p4-build-password
  renewal_publish_password:
    file: .local/p4-publisher-password
volumes:
  renewal_secrets:
  managed_credentials:
