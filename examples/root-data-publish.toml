schema_version = 1
source_root_id = "09a5f79b-96e7-47be-a022-92a6c0101210"
workspace = "pipeline"
stages = ["generate", "verify"]
max_parallel_jobs = 1
[publish_generated]
user = "p4forge-publisher"
paths = ["GameDesign/Tools/data_table/data_table/src", "GameDesign/Output/Sqlite"]
[[on_success]]
pipeline_id = "91ff0e4a-d970-4a76-aba0-5dd6a43e9130"
version = 1

[[on_success]]
pipeline_id = "40c3fc10-ffb0-4c41-ad51-bcdf6ae1b9cd"
version = 6

[[jobs]]
name = "data-table-generate"
stage = "generate"
runner = { os = "macos", arch = "aarch64", pool = "default" }
shell = "sh"
timeout_seconds = 600
environment = { VERSION = "0.0.1", VCS = "Perforce", STREAM = "//streams/root" }
script = [
  'mkdir -p GameDesign/Output/Sqlite',
  'chmod -R u+w GameDesign/Tools GameDesign/Output/Sqlite',
  'cargo run -p data_table_gen_v2 --manifest-path GameDesign/Tools/Cargo.toml -- --sqlite --rust',
]
[[jobs]]
name = "verify-generated-data"
stage = "verify"
runner = { os = "macos", arch = "aarch64", pool = "default" }
shell = "sh"
timeout_seconds = 60
script = [
  '''/usr/bin/python3 -c 'import pathlib,sqlite3,hashlib; p=pathlib.Path("GameDesign/Output/Sqlite/data_table.sqlite"); assert p.is_file(); db=sqlite3.connect("file:"+str(p)+"?mode=ro",uri=True); assert db.execute("pragma integrity_check").fetchone()[0]=="ok"; n=db.execute("select count(*) from sqlite_master where type=char(116,97,98,108,101)").fetchone()[0]; assert n>0; print("SQLite tables:",n,"SHA256:",hashlib.sha256(p.read_bytes()).hexdigest()); sources=list(pathlib.Path("GameDesign/Tools/data_table/data_table/src").rglob("*.rs")); assert sources; print("Rust generated sources:",len(sources))' ''',
]
