schema_version = 1

[[pipelines]]
name = "data-table-generate"
category = "server"
runner_os = "macos"
runner_arch = "aarch64"
needs = []
changes = [
    "GameDesign/Data/**",
    "GameDesign/Enum/**",
    "GameDesign/Protos/**",
]
working_directory = "."
stages = [
    "generate",
    "publish",
]
workspace = "pipeline"
max_parallel_jobs = 1

[[pipelines.jobs]]
name = "data-table-generate"
stage = "generate"
needs = []
script = ["cargo run -p data_table_gen_v2 --manifest-path GameDesign/Tools/Cargo.toml -- --sqlite --rust"]
timeout_seconds = 600

[[pipelines.jobs]]
name = "publish-generated-data"
stage = "publish"
needs = []
script = ['python3 "${P4FORGE_PUBLISH_TOOL:?set the installed p4-publish.py path}" GameDesign/Tools/data_table/data_table/src/... GameDesign/Output/Sqlite/...']
timeout_seconds = 120

[[pipelines]]
name = "client-editor-build"
category = "client"
runner_os = "windows"
runner_arch = "x86_64"
needs = []
checkout_view = "ClientBuildView"
changes = ["Client/**"]
working_directory = "Client"
stages = ["build"]
workspace = "pipeline"
max_parallel_jobs = 1

[[pipelines.jobs]]
name = "build-client-editor"
stage = "build"
needs = []
script = ["./ci.ps1"]
timeout_seconds = 1800

[[pipelines]]
name = "client-windows-package"
category = "client"
runner_os = "windows"
runner_arch = "x86_64"
needs = []
checkout_view = "ClientBuildView"
changes = ["Client/**"]
working_directory = "Client"
stages = ["package"]
workspace = "pipeline"
max_parallel_jobs = 1

[[pipelines.jobs]]
name = "package-client-windows"
stage = "package"
needs = []
script = ["./ci/package-windows.ps1"]
timeout_seconds = 1800

[[pipelines]]
name = "client-android-googleplay-package"
category = "client"
runner_os = "macos"
runner_arch = "aarch64"
needs = []
checkout_view = "ClientBuildView"
changes = ["Client/**"]
working_directory = "Client"
stages = ["package"]
