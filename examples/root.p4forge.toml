runner_arch = "aarch64"
needs = []
checkout_view = "ClientBuildView"
changes = ["Client/**"]
working_directory = "Client"
stages = ["package"]
workspace = "pipeline"
max_parallel_jobs = 1

[[pipelines.jobs]]
name = "package-client-ios"
stage = "package"
needs = []
