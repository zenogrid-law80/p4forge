schema_version = 1
# Replace with the source root ID created in P4Forge.
source_root_id = "11111111-1111-4111-8111-111111111111"
max_parallel_jobs = 4

[[jobs]]
name = "build"
stage = "build"
shell = "sh"
script = ["cargo build --locked"]
timeout_seconds = 3600
[jobs.runner]
os = "linux"
arch = "x86_64"
pool = "default"

[[jobs]]
name = "test"
stage = "test"
needs = ["build"]
shell = "sh"
script = ["cargo test --locked"]
timeout_seconds = 3600
[jobs.runner]
os = "linux"
arch = "x86_64"
pool = "default"
